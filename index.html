<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Jony Digital | Catálogo</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(145deg,#050814,#101c39);
    color:white;
    min-height:100vh;
}

header{
    text-align:center;
    padding:35px 15px;
}

h1{
    font-size:clamp(30px,6vw,60px);
    margin:0;
    font-weight:900;
    color:#9ce4ff;
    text-shadow:
    0 1px 0 #458fc4,
    0 2px 0 #3275ad,
    0 3px 0 #24598d,
    0 4px 0 #153c65,
    0 7px 10px #000;
}

header p{
    color:#cbd5e1;
    letter-spacing:1px;
    font-size:12px;
}

.catalogo{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:22px;
    max-width:1300px;
    margin:auto;
    padding:20px;
    align-items:start;
}

.tarjeta{
    --color:#369cff;
    --claro:#d5efff;
    --oscuro:#154d91;
    background:linear-gradient(160deg,#18243a,#10182c);
    border:2px solid var(--color);
    border-radius:20px;
    padding:18px;
    box-shadow:0 8px 22px #0009;
}

.kraten{
    --color:#38dfd0;
    --claro:#c8fff8;
    --oscuro:#14635e;
}

.future{
    --color:#369cff;
    --claro:#d5efff;
    --oscuro:#154d91;
}

.argentum{
    --color:#b883ff;
    --claro:#f0deff;
    --oscuro:#583391;
}

.logo{
    position:relative;
    margin:15px 0 25px;
    text-align:center;
    padding-bottom:15px;
}

.logo h2{
    position:relative;
    margin:0;
    font-size:clamp(24px,5vw,32px);
    font-weight:900;
    font-style:italic;
    line-height:1.3;
    color:var(--color);
    isolation:isolate;
}

.logo h2::before{
    content:attr(data-logo);
    position:absolute;
    inset:0;
    z-index:-1;
    color:var(--oscuro);
    text-shadow:
    0 1px 0 var(--oscuro),
    0 2px 0 var(--oscuro),
    0 3px 0 var(--oscuro),
    0 4px 0 var(--oscuro),
    0 5px 0 var(--oscuro),
    0 6px 0 var(--oscuro),
    0 8px 8px #000;
}

.logo h2 span{
    background:linear-gradient(
        180deg,
        var(--claro) 0%,
        var(--color) 43%,
        var(--oscuro) 49%,
        var(--claro) 100%
    );
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    -webkit-text-stroke:0.3px var(--claro);
}

.logo::after{
    content:"";
    display:block;
    width:65%;
    height:2px;
    margin:18px auto 0;
    background:linear-gradient(
        90deg,
        transparent,
        var(--color),
        transparent
    );
}

.pantallas{
    text-align:center;
    background:#202d46;
    padding:12px;
    border-radius:10px;
    font-weight:bold;
    border:1px solid #ffffff15;
}

.precio{
    font-size:38px;
    font-weight:bold;
    text-align:center;
    margin:20px 0 5px;
    text-shadow:0 3px 5px #000;
}

.mensual{
    text-align:center;
    color:#cbd5e1;
    font-size:12px;
    letter-spacing:1px;
    margin-bottom:15px;
}

button{
    width:100%;
    padding:14px;
    margin-top:18px;
    border:0;
    border-radius:12px;
    background:linear-gradient(
        180deg,
        var(--claro,#bce9ff),
        var(--color,#369cff)
    );
    color:#080e1b;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:
    0 4px 0 var(--oscuro,#154d91),
    0 7px 12px #0007;
}

button:active{
    transform:translateY(3px);
    box-shadow:0 1px 0 var(--oscuro,#154d91);
}

.contenido{
    line-height:1.8;
    font-size:15px;
}

.contenido div{
    padding:7px 0;
    border-bottom:1px solid #ffffff10;
}

.beneficios{
    background:#25183e;
    border:1px solid #b883ff;
    border-radius:12px;
    padding:14px;
    line-height:1.8;
    text-align:center;
}

.beneficios strong{
    color:#d9baff;
    font-size:13px;
}

.galeria{
    display:grid;
    gap:12px;
    margin-top:20px;
}

.galeria img{
    width:100%;
    border-radius:10px;
    cursor:zoom-in;
    border:1px solid #ffffff20;
}

.aviso{
    padding:25px 10px;
    text-align:center;
    color:#94a3b8;
    font-size:13px;
}

dialog{
    background:#10182c;
    color:white;
    border:1px solid #54caff;
    border-radius:15px;
    max-width:95vw;
}

dialog::backdrop{
    background:#000c;
}

dialog img{
    max-width:85vw;
    max-height:75vh;
    object-fit:contain;
}

*{
    animation:none !important;
    transition:none !important;
}

@media(max-width:850px){
    .catalogo{
        grid-template-columns:1fr;
        max-width:550px;
        padding:15px;
    }

    header{
        padding:25px 10px 10px;
    }

    .tarjeta{
        padding:18px;
    }
}
</style>
</head>

<body>

<header>
    <h1>JONY DIGITAL</h1>
    <p>TU ENTRETENIMIENTO SIN LÍMITES</p>
    <h3>Elegí tu aplicación favorita</h3>
</header>

<main class="catalogo" id="catalogo"></main>

<footer class="aviso">
    Jony Digital · Catálogo de aplicaciones
</footer>

<dialog id="visor">
    <img id="fotoGrande" alt="Vista ampliada">
    <button onclick="document.getElementById('visor').close()">
        Cerrar
    </button>
</dialog>

<script>

const aplicaciones = [
    {
        nombre:"KRATEN",
        clase:"kraten",
        precio:"26.000",
        pantallas:3,
        fotos:["kraten1.png","kraten2.png"]
    },
    {
        nombre:"FUTURE TV",
        clase:"future",
        precio:"25.000",
        pantallas:3,
        fotos:["future1.png","future2.png"]
    },
    {
        nombre:"ARGENTUM PRO",
        clase:"argentum",
        precio:"25.000",
        pantallas:4,
        fotos:["argentum1.png","argentum2.png"],
        extra:true
    }
];

const contenidos = [
    "📺 Canales en vivo",
    "🏆 Eventos deportivos",
    "⚽ Pack Fútbol",
    "🎬 Pack HBO",
    "🇦🇷 Canales nacionales y del interior",
    "🌎 Canales internacionales",
    "🍿 Películas de estreno",
    "🎥 Acción, drama y terror",
    "📽️ Series",
    "🧸 Programación infantil",
    "🔞 Canales para adultos (+18)"
];

document.getElementById("catalogo").innerHTML =
aplicaciones.map((app,i)=>`

<article class="tarjeta ${app.clase}">

    <div class="logo">
        <h2 data-logo="${app.nombre}">
            <span>${app.nombre}</span>
        </h2>
    </div>

    <div class="pantallas">
        🖥️ ${app.pantallas} PANTALLAS
    </div>

    <div class="precio">$${app.precio}</div>
    <div class="mensual">POR MES</div>

    ${app.extra ? `
    <div class="beneficios">
        <strong>BENEFICIOS ADICIONALES</strong><br>
        🎵 Spotify<br>
        ▶️ YouTube Premium
    </div>` : ""}

    <button onclick="verDetalles(${i},this)">
        Ver aplicación
    </button>

    <section id="detalle${i}" hidden>

        <div class="galeria">
            ${app.fotos.map(foto=>`
                <img src="${foto}"
                alt="${app.nombre}"
                loading="lazy"
                onclick="ampliar(this.src)"
                onerror="this.hidden=true">
            `).join("")}
        </div>

        <h3>Contenidos incluidos</h3>

        <div class="contenido">
            ${contenidos.map(c=>`
                <div>${c}</div>
            `).join("")}
        </div>

    </section>

</article>

`).join("");

function verDetalles(i,boton){
    const detalle=document.getElementById("detalle"+i);

    detalle.hidden=!detalle.hidden;

    boton.textContent=detalle.hidden
    ?"Ver aplicación"
    :"Ocultar detalles";
}

function ampliar(src){
    document.getElementById("fotoGrande").src=src;
    document.getElementById("visor").showModal();
}

</script>

</body>
</html>
