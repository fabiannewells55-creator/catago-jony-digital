
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Jony Digital | Catálogo Premium</title>

<style>
*{
box-sizing:border-box;
animation:none!important;
transition:none!important;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(145deg,#050814,#101c39);
color:white;
min-height:100vh;
}

header{
text-align:center;
padding:15px 15px 0;
}

.cabecera{
display:block;
width:100%;
max-width:1300px;
height:auto;
margin:auto;
border-radius:18px;
box-shadow:0 8px 25px #0009;
}

.catalogo{
display:grid;
grid-template-columns:repeat(3,minmax(0,1fr));
align-items:start;
gap:24px;
max-width:1300px;
margin:auto;
padding:20px;
}

.tarjeta{
min-width:0;
background:linear-gradient(155deg,#24334e,#10182c 35%,#090f20);
border:2px solid var(--color);
border-top-color:var(--claro);
border-radius:22px;
padding:18px;
box-shadow:0 6px 0 var(--oscuro),0 12px 25px #0009,inset 0 1px 3px #ffffff30;
}

.kraten{
--color:#35d8cf;
--claro:#cafffb;
--oscuro:#087d78;
}

.future{
--color:#269bff;
--claro:#d8efff;
--oscuro:#14539b;
}

.argentum{
--color:#bd65ff;
--claro:#f0ddff;
--oscuro:#6530a0;
}

.logo-app{
display:block;
width:180px;
max-width:100%;
aspect-ratio:1;
object-fit:cover;
border-radius:50%;
margin:10px auto 18px;
border:5px solid var(--color);
border-top-color:var(--claro);
border-bottom-color:var(--oscuro);
box-shadow:0 5px 0 var(--oscuro),0 12px 20px #000b;
}

.logo-3d{
text-align:center;
font-size:clamp(25px,4vw,34px);
font-weight:1000;
letter-spacing:1.5px;
margin:15px 0;
background:linear-gradient(180deg,#fff,var(--claro),var(--color),var(--oscuro));
-webkit-background-clip:text;
background-clip:text;
-webkit-text-fill-color:transparent;
filter:drop-shadow(0 3px 0 var(--oscuro)) drop-shadow(0 5px 4px #000);
}

.pantallas{
text-align:center;
background:linear-gradient(#30405c,#152037);
padding:14px;
border-radius:12px;
font-weight:bold;
border:1px solid #ffffff25;
box-shadow:0 4px 0 #070c18;
}

button{
width:100%;
padding:15px;
margin-top:18px;
border:0;
border-radius:12px;
background:linear-gradient(180deg,var(--claro,#d8efff),var(--color,#54caff));
color:#080e1b;
font-size:17px;
font-weight:bold;
cursor:pointer;
box-shadow:0 4px 0 var(--oscuro,#14539b),0 7px 12px #0008;
}

.contenido{
line-height:1.8;
font-size:15px;
}

.contenido div{
padding:8px 4px;
border-bottom:1px solid #ffffff12;
}

.beneficios{
background:#25183e;
border:1px solid #bd65ff;
border-radius:12px;
padding:14px;
margin-top:15px;
line-height:1.8;
}

.galeria{
display:grid;
gap:12px;
margin-top:22px;
}

.galeria img{
width:100%;
border-radius:12px;
border:1px solid var(--color);
cursor:zoom-in;
}

h3{
color:var(--color,#54caff);
text-align:center;
}

video{
display:block;
width:100%;
max-width:100%;
border-radius:12px;
border:1px solid var(--color);
background:#000;
}

.guia{
margin-top:22px;
padding:15px;
background:#080f20;
border:1px solid var(--color);
border-radius:16px;
box-shadow:0 5px 15px #0008;
line-height:1.7;
}

.downloader{
display:block;
width:180px;
max-width:100%;
margin:15px auto;
border-radius:14px;
}

.codigo{
display:block;
text-align:center;
font-size:clamp(26px,7vw,38px);
font-weight:900;
letter-spacing:2px;
color:var(--claro);
background:linear-gradient(#24334e,#10182c);
border:2px solid var(--color);
border-radius:14px;
padding:15px 4px;
box-shadow:0 4px 0 var(--oscuro),inset 0 3px 8px #0008;
}

.guia-final{
text-align:center;
color:var(--color);
font-weight:bold;
margin-top:20px;
}

.aviso{
padding:30px 10px;
text-align:center;
color:#94a3b8;
}

dialog{
background:#10182c;
color:white;
border:1px solid #54caff;
border-radius:15px;
max-width:95vw;
}

dialog::backdrop{
background:#000c;
}

dialog img{
max-width:85vw;
max-height:75vh;
object-fit:contain;
}

[hidden]{
display:none!important;
}

@media(max-width:850px){
.catalogo{
grid-template-columns:1fr;
max-width:550px;
padding:15px;
gap:25px;
}
}
</style>
</head>

<body>

<header>
<img class="cabecera"
src="file_000000003aa8820e95527cb3b5f5e525.png"
alt="Jony Digital - Tu entretenimiento sin límites">
</header>

<main class="catalogo" id="catalogo"></main>

<footer class="aviso">
JONY DIGITAL · TU ENTRETENIMIENTO SIN LÍMITES
</footer>

<dialog id="visor">
<img id="fotoGrande" alt="Vista ampliada">
<button onclick="document.getElementById('visor').close()">
Cerrar
</button>
</dialog>

<script>

const aplicaciones=[
{
nombre:"KRATEN",
clase:"kraten",
logo:"IMG-20261118-WA0160.jpg",
pantallas:3,
fotos:["kraten1.png","kraten2.png"],
video:"VID-20261011-WA0025.mp4",
codigo:"5702599"
},
{
nombre:"FUTURE TV",
clase:"future",
logo:"IMG-20261118-WA0142.jpg",
pantallas:3,
fotos:["future1.png","future2.png"],
video:"VID-20260710-WA0147.mp4",
codigo:"2820647"
},
{
nombre:"ARGENTUM PRO",
clase:"argentum",
logo:"IMG-20261118-WA0161.jpg",
pantallas:4,
fotos:["argentum1.png","argentum2.png"],
codigo:"4708062",
extra:true
}
];

const contenidos=[
"📺 Canales en vivo",
"🏆 Eventos deportivos",
"⚽ Pack Fútbol",
"🎬 Pack HBO",
"🇦🇷 Canales nacionales y del interior",
"🌎 Canales internacionales",
"🍿 Películas de estreno",
"🎥 Acción, drama y terror",
"📽️ Series",
"🧸 Programación infantil",
"🔞 Canales para adultos (+18)"
];

document.getElementById("catalogo").innerHTML=
aplicaciones.map((app,i)=>`

<article class="tarjeta ${app.clase}">

<img class="logo-app"
src="${app.logo}"
alt="Logo ${app.nombre}"
onerror="this.hidden=true">

<h2 class="logo-3d">${app.nombre}</h2>

<div class="pantallas">
🖥️ ${app.pantallas} PANTALLAS
</div>

${app.extra?`
<div class="beneficios">
<strong>BENEFICIOS ADICIONALES</strong><br>
🎵 Spotify<br>
▶️ YouTube Premium
</div>`:""}

<button onclick="verDetalles(${i},this)">
Ver aplicación
</button>

<section id="detalle${i}" hidden>

<h3>📸 Imágenes de la aplicación</h3>

<div class="galeria">
${app.fotos.map(foto=>`
<img src="${foto}"
alt="${app.nombre}"
loading="lazy"
onclick="ampliar(this.src)"
onerror="this.hidden=true">
`).join("")}
</div>

${app.video?`

<h3>🎬 Video de presentación</h3>

<video controls playsinline preload="none"
poster="${app.fotos[0]}">
<source src="${app.video}" type="video/mp4">
Tu navegador no admite este video.
</video>

`:""}

<h3>⭐ Contenidos incluidos</h3>

<div class="contenido">
${contenidos.map(c=>`<div>${c}</div>`).join("")}
</div>

<div class="guia">

<h3>📥 CÓMO DESCARGAR E INSTALAR</h3>

<p>📺 <strong>PASO 1:</strong><br>
Contar con un televisor con sistema Android TV.</p>

<p>📲 <strong>PASO 2:</strong><br>
Descargar Downloader desde la tienda de aplicaciones.</p>

<img class="downloader"
src="IMG-20260619-WA0070.jpg"
alt="Downloader"
loading="lazy">

<p>🔢 <strong>PASO 3:</strong><br>
Abrir Downloader e ingresar el siguiente código:</p>

<div class="codigo">${app.codigo}</div>

<p>⬇️ <strong>PASO 4:</strong><br>
Descargar e instalar la aplicación.</p>

<p>🔑 <strong>PASO 5:</strong><br>
Ingresar con el usuario y la contraseña proporcionados por el vendedor.</p>

<div class="guia-final">
🍿 ¡YA PODÉS DISFRUTAR DE TU ENTRETENIMIENTO!
</div>

</div>
</section>
</article>

`).join("");

function verDetalles(i,boton){
const detalle=document.getElementById("detalle"+i);

detalle.hidden=!detalle.hidden;

if(detalle.hidden){
detalle.querySelectorAll("video").forEach(v=>v.pause());
}

boton.textContent=detalle.hidden
?"Ver aplicación"
:"Ocultar detalles";
}

function ampliar(src){
document.getElementById("fotoGrande").src=src;
document.getElementById("visor").showModal();
}

</script>

<style>
.downloader-captura{
position:relative;
width:100%;
margin:18px auto;
overflow:hidden;
border-radius:12px;
}

.downloader-captura img{
display:block;
width:100%;
height:auto;
}

.downloader-numero{
position:absolute;
top:36%;
left:7%;
width:86%;
height:25%;
display:flex;
align-items:center;
justify-content:center;
background:#fff;
color:#111;
border-radius:8px;
font-size:clamp(16px,4vw,30px);
font-weight:900;
letter-spacing:2px;
}
</style>

<script>
document.querySelectorAll(".tarjeta").forEach(tarjeta=>{

const nombre=tarjeta.querySelector(".logo-3d").textContent.trim();
const guia=tarjeta.querySelector(".guia");

if(!guia)return;

guia.querySelector("h3").textContent=
"📥 CÓMO INSTALAR "+nombre;

const codigo=guia.querySelector(".codigo");

if(!codigo)return;

const numero=codigo.textContent.trim();

codigo.outerHTML=`
<div class="downloader-captura">
<img src="Screenshot_20261126_232136_Downloader.jpg"
alt="Pantalla de Downloader">
<div class="downloader-numero">${numero}</div>
</div>
`;
});
</script>

<style>
.logo-premium-marco{
display:grid;
grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
align-items:center;
gap:5px;
width:100%;
}

.logo-premium-marco .logo-app{
max-width:100%;
}

.logo-premium-lateral{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:18px;
min-width:0;
}

.logo-premium-icono{
width:clamp(25px,8vw,58px);
max-width:100%;
aspect-ratio:1;
display:flex;
align-items:center;
justify-content:center;
color:var(--color);
background:linear-gradient(145deg,#34465c,#080e1b);
border:2px solid var(--color);
border-radius:15px;
box-shadow:
0 4px 0 var(--logo-dark),
0 0 12px color-mix(in srgb,var(--color) 40%,transparent);
animation:none!important;
transition:none!important;
}

.logo-premium-icono svg{
width:78%;
height:78%;
filter:drop-shadow(0 2px 1px #000);
}

@media(max-width:380px){
.logo-premium-marco{
grid-template-columns:1fr minmax(0,180px) 1fr;
}
}
</style>

<script>
(()=>{
const iconos=[
'<rect x="3" y="6" width="26" height="19" rx="4"/><path d="M10 2l6 4 6-4M10 29h12"/><path d="M13 11l8 5-8 5z" fill="currentColor"/>',

'<circle cx="16" cy="16" r="13"/><path d="M16 9l6 5-2 7h-8l-2-7z" fill="currentColor"/><path d="M16 9V3M22 14l7-3M20 21l5 6M12 21l-5 6M10 14l-7-3"/>',

'<rect x="3" y="12" width="26" height="17" rx="3"/><path d="M3 12L1 6 26 1l2 6zM9 4l5 5M18 2l5 5"/><path d="M13 16l8 5-8 5z" fill="currentColor"/>',

'<circle cx="16" cy="16" r="13"/><path d="M12 8l13 8-13 8z" fill="currentColor"/>'
];

function crearIcono(n){
return `<div class="logo-premium-icono">
<svg viewBox="0 0 32 32" fill="none"
stroke="currentColor" stroke-width="2"
stroke-linejoin="round">
${iconos[n]}
</svg></div>`;
}

document.querySelectorAll(".tarjeta").forEach(tarjeta=>{
const logo=tarjeta.querySelector(".logo-app");

if(!logo || logo.closest(".logo-premium-marco"))return;

const marco=document.createElement("div");
marco.className="logo-premium-marco";

marco.innerHTML=`
<div class="logo-premium-lateral" aria-hidden="true">
${crearIcono(0)}
${crearIcono(1)}
</div>
<div class="logo-premium-centro"></div>
<div class="logo-premium-lateral" aria-hidden="true">
${crearIcono(2)}
${crearIcono(3)}
</div>`;

logo.before(marco);
marco.querySelector(".logo-premium-centro").appendChild(logo);
});
})();
</script>

<style>

<script>
(() => {

    const spotify = `
    <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="12"
        fill="#1ed760"/>
        <path d="M5 9c5-1.5 10-1 14 1.5
        M6 12.5c4-1 8-.6 11.5 1.4
        M7 16c3-.7 6-.4 9 1"
        fill="none"
        stroke="#101010"
        stroke-width="1.7"
        stroke-linecap="round"/>
    </svg>`;

    const youtube = `
    <svg viewBox="0 0 48 40">
        <rect x="1" y="4"
        width="46" height="32"
        rx="9" fill="#ff0033"/>
        <path d="M19 12L32 20L19 28Z"
        fill="white"/>
    </svg>`;

    const whatsapp = `
    <svg viewBox="0 0 32 32">
        <path fill="white" d="M16 2
        A14 14 0 0 0 4 23
        L2 30L9 28
        A14 14 0 1 0 16 2Z"/>
        <path fill="#128c4b" d="M16 4.5
        A11.5 11.5 0 0 0 6.5 22
        L5.3 26.7L10 25.4
        A11.5 11.5 0 1 0 16 4.5Z"/>
        <path fill="white" d="M10 8
        Q7 9 10 16
        Q14 23 22 23
        L25 19L19 16L17 19
        Q12 16 12 13
        L14 11L12 7Z"/>
    </svg>`;

    const beneficios =
        document.querySelector(
            ".argentum .beneficios"
        );

    if (beneficios) {
        beneficios.innerHTML = `
        <strong>BENEFICIOS ADICIONALES</strong>

        <div class="marca-beneficio spotify-premium">
            ${spotify}
            <span>Spotify</span>
        </div>

        <div class="marca-beneficio youtube-premium">
            ${youtube}
            <span>YouTube Premium</span>
        </div>`;
    }

    const titulos = [
        "ANDROID TV",
        "DESCARGAR DOWNLOADER",
        "CÓDIGO DE INSTALACIÓN",
        "INSTALAR APLICACIÓN",
        "INICIAR SESIÓN"
    ];

    document.querySelectorAll(".tarjeta")
    .forEach(tarjeta => {

        const guia =
            tarjeta.querySelector(".guia");

        if (!guia) return;

        guia.querySelectorAll("p strong")
        .forEach((titulo,i) => {
            if (titulos[i]) {
                titulo.textContent =
                "PASO " + (i + 1) +
                " · " + titulos[i];
            }
        });

        const final =
            guia.querySelector(".guia-final");

        if (final) final.remove();

        if (!tarjeta.querySelector(
            ".contactar-whatsapp, .contactar"
        )) {

            const contacto =
                document.createElement("a");

            contacto.className =
                "contactar-whatsapp";

            contacto.href =
                "https://wa.me/5493417818827";

            contacto.target = "_blank";

            contacto.rel =
                "noopener noreferrer";

            contacto.innerHTML =
                whatsapp + "<span>Contactar</span>";

            guia.after(contacto);
        }

    });

})();
</script>
